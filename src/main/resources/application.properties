spring.application.name=position-doctor-project

# ===========================
# Database Configuration
# ===========================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===========================
# JPA / Hibernate
# ===========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===========================
# Server
# ===========================
server.port=${PORT:8080}

# ===========================
# JWT Security
# ===========================
app.security.jwt-secret=${APP_SECURITY_JWT_SECRET}
app.security.jwt-expiration-ms=86400000

# ===========================
# Market Data
# ===========================
app.market-data.provider=finnhub
app.market-data.finnhub.base-url=${FINNHUB_BASE_URL:https://finnhub.io/api/v1}
app.market-data.finnhub.api-key=${FINNHUB_API_KEY}
app.market-data.connect-timeout-ms=5000
app.market-data.read-timeout-ms=10000
app.market-data.max-retries=3

# ===========================
# Risk Engine
# ===========================
app.risk-engine.default-max-drawdown-percent=15.0
app.risk-engine.default-stop-loss-threshold=5.0
app.risk-engine.calculation-batch-size=100
